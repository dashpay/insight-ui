name: Test and Release

on:
  workflow_dispatch:
  release:
    types:
      - published
  pull_request:
    branches:
      - master
      - v[0-9]+.[0-9]+-dev

jobs:
  test:
    name: Run Insight UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable NPM cache
        uses: actions/cache@v4
        with:
          path: '~/.npm'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Check NPM package lock version is updated
        uses: dashevo/gh-action-check-package-lock@v1

      - name: Install NPM dependencies
        run: npm ci

      - name: Run ESLinter
        run: npm run lint

      - name: Use https instead of git protocol fo git
        run: git config --global url."https://".insteadOf git://

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test

  build-npm:
    name: Build NPM package
    runs-on: ubuntu-24.04
    needs: test
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    # The build installs and runs third-party code (npm, bower, grunt), so it
    # runs here, in a job that cannot request an npm publish token
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check package version matches tag
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version v$VERSION"
            exit 1
          fi

      - name: Enable NPM cache
        uses: actions/cache@v4
        with:
          path: '~/.npm'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NPM dependencies
        run: npm ci

      - name: Use https instead of git protocol fo git
        run: git config --global url."https://".insteadOf git://

      # The same build that prepublishOnly ran when npm publish was called on
      # the checkout
      - name: Build project
        run: npm run build

      - name: Pack NPM package
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Upload NPM package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  release-npm:
    name: Release NPM package
    runs-on: ubuntu-24.04
    needs: build-npm
    # A release publishes the package. A manual run only rehearses the publish:
    # it checks that npm accepts this workflow as a trusted publisher, and
    # publishes nothing.
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    # npm trusted publishing: npm exchanges the job's OIDC token for a publish
    # token, so no NPM_TOKEN secret is needed
    permissions:
      contents: read
      id-token: write
    # Every step here can request an npm publish token, so only GitHub's own
    # actions run, pinned to commits, and the checks are plain shell. The
    # repository is not checked out: the job publishes the tarball built above.
    steps:
      # Trusted publishing needs npm 11.5.1 or later. No registry-url: with it,
      # setup-node writes a token entry to .npmrc and npm tries token auth
      # instead of the OIDC exchange.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.1'

      - name: Download NPM package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: npm-package

      - name: Find NPM package
        id: package
        run: |
          shopt -s nullglob
          FILES=(npm-package/*.tgz)
          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "::error::Expected one package tarball, found ${#FILES[@]}"
            exit 1
          fi
          echo "file=${FILES[0]}" >> "$GITHUB_OUTPUT"

      # X.Y-dev for dev releases, latest otherwise
      - name: Set release tag
        id: tag
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_TAG" == *dev* ]]; then
            [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+) ]]
            echo "result=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}-dev" >> "$GITHUB_OUTPUT"
          else
            echo "result=latest" >> "$GITHUB_OUTPUT"
          fi

      # --ignore-scripts: no package script runs while the OIDC token is
      # available. Trusted publishing adds a provenance attestation, which
      # requires package.json's repository.url to name this repository.
      - name: Publish NPM package
        if: ${{ github.event_name == 'release' }}
        env:
          NPM_TAG: ${{ steps.tag.outputs.result }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: npm publish "$PACKAGE_FILE" --ignore-scripts --access public --tag "$NPM_TAG"

      # npm does the OIDC exchange on a dry run too, and without a token a dry
      # run only warns, so the result is read from npm's verbose log. The text
      # matched is the one printed by the npm that ships with the Node version
      # pinned above.
      - name: Rehearse the publish
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: |
          LOG="$RUNNER_TEMP/npm-publish-dry-run.log"
          npm publish "$PACKAGE_FILE" --dry-run --ignore-scripts --access public --loglevel verbose 2>&1 | tee "$LOG"
          if ! grep -q 'oidc Successfully retrieved and set token' "$LOG"; then
            echo "::error::npm did not accept this workflow as a trusted publisher of this package. See the oidc lines above."
            exit 1
          fi

  release-docker:
    name: Release Docker image
    runs-on: ubuntu-24.04
    needs: release-npm
    if: ${{ github.event_name == 'release' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set suffix to Docker tags
        uses: actions/github-script@v7
        id: suffix
        with:
          result-encoding: string
          script: "return (context.payload.release.tag_name.includes('-dev') ? '-dev' : '');"

      - name: Set Docker tags and labels
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: dashpay/insight
          tags: |
            type=match,pattern=v(\d+),group=1
            type=match,pattern=v(\d+.\d+),group=1
            type=match,pattern=v(\d+.\d+.\d+),group=1
            type=match,pattern=v(.*),group=1,suffix=,enable=${{ contains(github.event.release.tag_name, '-dev') }}
          flavor: |
            latest=${{ !contains(github.event.release.tag_name, '-dev') }}
            suffix=${{ steps.suffix.outputs.result }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.event.release.tag_name }}

      - name: Output Docker image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
